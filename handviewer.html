<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand viewer</title>
<style>
  :root{ --panel:#182234; --line:#2a3852; --ink:#e7eef7; --dim:#8ea0bd; --accent:#5ee0a0;
    --sp:#e9eef7; --he:#ff6b6b; --di:#ffab5e; --cl:#5fd39a; --gold:#E5B17C; }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,#1b2740,#0f1622);color:var(--ink);
    font:14px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}
  a{color:#7fd0ff;text-decoration:none} a:hover{text-decoration:underline}
  .top{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line)}
  .top h1{font-size:15px;margin:0;font-weight:600;color:#fff}
  #rotate,.tbtn{background:#182234;border:1px solid var(--line);color:var(--ink);border-radius:8px;
    min-width:30px;height:27px;cursor:pointer;font-size:12px;line-height:1} #rotate{font-size:15px}
  #rotate:hover,.tbtn:hover{border-color:var(--accent)} .tbtn:disabled{opacity:.35;cursor:default}
  #tools{display:flex;gap:5px} #setbar{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px}
  #setbar b{color:var(--accent);font-weight:600}
  .top .sub{color:var(--dim);font-size:12px}
  .wrap{max-width:660px;margin:0 auto;padding:18px 14px 44px}
  .table{display:grid;grid-template-columns:1fr 1.1fr 1fr;grid-template-rows:auto auto auto;gap:10px;
    align-items:center;justify-items:center;background:linear-gradient(180deg,#123049,#0e2336);
    border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
  .seat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 12px;
    width:100%;max-width:215px;min-width:0}
  .seat.n{grid-column:2;grid-row:1} .seat.s{grid-column:2;grid-row:3}
  .seat.w{grid-column:1;grid-row:2} .seat.e{grid-column:3;grid-row:2}
  .seat .lbl{font-size:11px;color:var(--dim);letter-spacing:.04em;margin-bottom:3px;display:flex;
    justify-content:space-between;align-items:center}
  .seat.deal .lbl b{color:var(--gold)}
  /* who sat there (pl=), when the link came from a protocol: the player over their team */
  .seat .who{font-size:11.5px;line-height:1.25;margin:-1px 0 5px;overflow-wrap:anywhere}
  .seat .who b{color:var(--fg);font-weight:600}
  .seat .who span{display:block;font-size:10px;color:var(--dim);letter-spacing:.03em}
  .seat.onlead{outline:2px solid var(--accent);outline-offset:1px}
  /* long suit (up to 13 cards) must never widen the seat past its track and force a page scroll —
     wrap the overflow cards onto a second line rather than overflowing. The hanging indent
     (padding on the row, negative margin on the symbol) keeps wrapped cards aligned under the
     first card, not under the suit symbol. */
  .suit{display:flex;flex-wrap:wrap;gap:2px 6px;font-size:15px;letter-spacing:.5px;line-height:1.5;padding-left:20px}
  .suit .s{width:14px;display:inline-block;text-align:center;margin-left:-20px}
  .sp{color:var(--sp)} .he{color:var(--he)} .di{color:var(--di)} .cl{color:var(--cl)}
  .card{padding:0 1px;border-radius:3px}
  .card.played{opacity:.2;text-decoration:line-through}
  .card.now{background:var(--accent);color:#08331f;font-weight:700;text-decoration:none;opacity:1}
  .mid{grid-column:2;grid-row:2;text-align:center;background:#0a1826;border:1px solid var(--line);
    border-radius:10px;padding:8px 10px;min-width:98px}
  .mid .dlr{font-size:11px;color:var(--dim)} .mid .ct{font-size:19px;font-weight:700;margin-top:3px}
  /* current trick laid out on the "table": cards at each seat's direction, contract in the middle */
  .tablecards{display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:auto auto auto;
    align-items:center;justify-items:center;column-gap:5px;min-height:56px;margin-top:2px}
  .tablecards .tc{min-width:14px;min-height:19px;font-size:15px;line-height:1;white-space:nowrap;
    display:flex;align-items:center;justify-content:center}
  .tc[data-pos="top"]{grid-column:2;grid-row:1} .tc[data-pos="bottom"]{grid-column:2;grid-row:3}
  .tc[data-pos="left"]{grid-column:1;grid-row:2} .tc[data-pos="right"]{grid-column:3;grid-row:2}
  .tablecards .ct{grid-column:2;grid-row:2;margin-top:0}
  .tc.win{box-shadow:inset 0 -2px 0 var(--accent);border-radius:3px}
  .rslt{font-size:13px;color:#8ea0bd;font-weight:400}
  .vred{color:#ff7a7a!important}
  .panels{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px}
  .box{flex:1 1 250px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .box h2{margin:0 0 9px;font-size:11px;letter-spacing:.06em;color:var(--dim);text-transform:uppercase;font-weight:600}
  table{border-collapse:collapse;width:100%}
  .auc th{color:var(--dim);font-weight:600;font-size:11px;padding:2px 4px;border-bottom:1px solid var(--line)}
  .auc td{text-align:center;padding:4px;font-size:14px}
  .call.pass{color:var(--dim)} .call.dbl{color:#ff9d5e;font-weight:700}
  .dd th,.dd td{text-align:center;padding:3px 7px;font-size:13px;border:1px solid var(--line)}
  .dd th{color:var(--dim);font-weight:600}
  .dd td.make{color:var(--accent);font-weight:700} .dd td.lo{color:#5a6a80}
  .par{margin-top:9px;font-size:13px;color:var(--dim)} .par b{color:var(--ink)}
  .pardecl{color:var(--gold)}
  .play{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
  .play button{background:#0d1c2e;border:1px solid var(--line);color:var(--ink);border-radius:8px;
    padding:7px 12px;font-size:14px;cursor:pointer;min-width:40px} .play button:hover{border-color:var(--accent)}
  .play button:disabled{opacity:.35;cursor:default}
  .play .tk{color:var(--dim);font-size:12px;margin-left:auto}
  .pl-load{color:var(--dim);font-size:12.5px;padding:7px 2px}
  /* interactive play (#5) */
  .pmode{display:flex;gap:6px;margin-bottom:11px}
  .pmode .pm{background:#0d1c2e;border:1px solid var(--line);color:var(--dim);border-radius:8px;
    padding:5px 11px;font-size:12px;cursor:pointer}
  .pmode .pm.on{background:#123049;color:var(--ink);border-color:var(--accent)}
  .pmode .pm:hover{color:var(--ink)}
  .card.legal{cursor:pointer;box-shadow:inset 0 -2px 0 var(--accent);border-radius:3px}
  .card.legal:hover{background:var(--accent);color:#08331f;font-weight:700}
  .card.leadcard{outline:1.5px solid var(--accent)} .card.leadcard.cost{outline-color:#ffab5e}
  .seat.facedown .card.leadcard{outline:none}
  .quiz .ddbox,.quiz .leadsbox,.quiz #leadline,.quiz #audit,.quiz .rslt{display:none}
  .quiz .card.leadcard{outline:none}
  .quiz .seat.facedown .suit,.blind .seat.facedown .suit{visibility:hidden}
  .blind .ipmsg:not(.blindonly){display:none}
  .blind .ddbox,.blind .leadsbox,.blind #leadline,.blind #audit,.blind .rslt,.blind #ipdd,.blind #ipfb,
  .blind #ipstart,.blind #ipu,.blind #ipf,.blind #iptrick,.blind #ipbest,.blind #ipclaim,.blind #ddonce,.blind #ddauto,.blind #plink{display:none}
  .blindonly{display:none} .blind .blindonly{display:block}
  .quiz #tools,.blind #tools{display:none}
  .task .iptr,.task .play:not(.taskbtns) button,.task #ipdd,.task #ipfb,.task #ipaudit,.task #audit,
  .task .blindonly,.task .ipmsg{display:none}
  #audit,#ipaudit{font-size:12.5px;color:var(--dim);margin-bottom:6px}
  #audit button,#ipaudit button{background:none;border:0;color:#ffab5e;cursor:pointer;font:inherit;padding:0 3px}
  #audit button:hover,#ipaudit button:hover{text-decoration:underline}
  .ldrow{margin:2px 0;font-size:13px} .ldrow>b{display:inline-block;min-width:58px;color:var(--dim);font-weight:600}
  .ldrow span.ld{margin-right:6px} .ldrow span.ld.l{outline:1.5px solid var(--accent);border-radius:3px;padding:0 1px}
  .seat.toplay{outline:2px solid var(--accent);outline-offset:2px;box-shadow:0 0 0 4px rgba(94,224,160,.12)}
  .table.ipmode .seat.onlead{outline:none} .table.ipmode .leadmark{display:none}
  .ipmsg{color:#66788f;font-size:11.5px;margin-top:9px;line-height:1.4}
  .ipdd{color:var(--dim);font-size:12.5px;margin-top:8px} .ipdd b{color:var(--accent)}
  .ipfb{color:#ffab5e;font-size:12px;margin-top:4px;min-height:15px}
  .ipdim{color:#5a6a80}
  .ddv{font-size:9px;font-weight:700;margin-left:1px;vertical-align:super;line-height:0}
  .ddv.made{color:var(--accent)} .ddv.set{color:var(--he)}
  .iptr{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:9px}
  .iptr .trl{color:var(--dim);font-size:12px;margin-right:1px}
  .tr{background:#0d1c2e;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer}
  .tr.on{background:#123049;color:var(--ink);border-color:var(--accent)} .tr:hover{color:var(--ink)}
  #trhide{margin-left:6px} #trhide.on{background:#3a1a1a;border-color:var(--he);color:#ffd0d0}
  /* single-dummy hide: the DD hands go face-down (ranks concealed) */
  .seat.facedown .hand{pointer-events:none;user-select:none}
  .seat.facedown .suit .s{opacity:.22}
  .seat.facedown .card{color:transparent;background:#26385c;border-radius:2px;box-shadow:inset 0 0 0 1px #3a4f78;
    min-width:13px;text-align:center}
  .seat.facedown .card.played{opacity:.3}
  /* trick history: a scrollable strip of completed tricks, winner card marked */
  .ipth{display:flex;gap:5px;overflow-x:auto;margin-top:7px;padding-bottom:2px;align-items:center}
  .ipth .thlab{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.05em;flex:0 0 auto}
  .tht{display:inline-flex;align-items:center;gap:3px;background:#0a1826;border:1px solid var(--line);
    border-radius:6px;padding:2px 6px;font-size:11.5px;white-space:nowrap;flex:0 0 auto}
  .tht .thn{color:#5a6a80;font-size:9px} .thc{opacity:.62} .thc .who,.tht .who{display:none}
  .thc.w{opacity:1;box-shadow:inset 0 -2px 0 var(--accent);border-radius:2px}
  .play button.on{background:#123049;color:var(--ink);border-color:var(--accent)}
  .trick{display:flex;gap:7px;align-items:center;min-height:30px;margin-top:9px;flex-wrap:wrap}
  .trick .pc{background:#0a1826;border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:15px}
  .trick .pc.win{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:#0e2a1e}
  .trick .pc .who{color:var(--dim);font-size:10px;margin-right:5px}
  .empty{color:var(--dim);text-align:center;padding:50px 10px}
  .note{color:#66788f;font-size:11px;margin-top:18px;text-align:center}
  /* Vertical density pass — fit the whole viewer (compass + auction + DD + play panel) within one
     1080p screen. Trims padding, gaps and line-heights only; nothing structural. */
  body{line-height:1.4}
  .top{padding:7px 18px} .wrap{padding:9px 14px 10px}
  .table{gap:6px;padding:9px} .seat{padding:4px 11px} .seat .lbl{margin-bottom:1px}
  .suit{gap:1px 6px;line-height:1.26;font-size:14px} .mid{padding:5px 10px} .mid .ct{font-size:17px;margin-top:1px}
  .panels{gap:10px;margin-top:7px} .box{padding:7px 13px} .box h2{margin:0 0 5px}
  .auc td{padding:2px 4px} .dd th,.dd td{padding:2px 7px} .par{margin-top:6px}
  .play{gap:7px;margin-top:7px} .play button{padding:5px 11px} .pl-load{padding:5px 2px}
  .pmode{margin-bottom:8px} .ipmsg{margin-top:6px} .ipdd{margin-top:6px}
  .ipfb{margin-top:3px;min-height:14px} .trick{min-height:24px;margin-top:6px} .note{margin-top:9px}
  /* a sheet for the printer: the deal, the auction and the double-dummy, in ink */
  @media print{
    :root{--panel:#fff;--line:#999;--ink:#000;--dim:#333;--accent:#000;--sp:#000;--he:#c8102e;--di:#d9730d;--cl:#0a7a3c;--gold:#000}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    body{background:#fff;color:#000;min-height:0} .top h1{color:#000} .wrap{max-width:none;padding:6px 0}
    .top{padding:0 0 6px} #rotate,#tools,#setbar,#back,#playbox,.note,.tc{display:none!important}
    .table{background:none;box-shadow:none;border-color:#999} .mid{background:#fff}
    .seat{max-width:none} .seat.toplay,.seat.onlead{outline:none;box-shadow:none}
    .card,.card.played,.card.now,.card.legal,.seat.facedown .card{opacity:1;text-decoration:none;background:none;color:inherit;font-weight:400;box-shadow:none}
    .seat.facedown .suit .s{opacity:1}
    .ddv{display:none} .dd td.lo{color:#666} .box{break-inside:avoid}
  }
</style>
</head>
<body>
<div class="top"><h1>Hand viewer</h1><span class="sub" id="sub"></span>
  <span id="setbar"></span>
  <button id="rotate" title="rotate the table — put the next seat at the bottom" style="margin-left:auto;display:none">&#8635;</button>
  <span id="tools" style="display:none"><button class="tbtn" id="print" title="print the deal">&#9113;</button>
    <button class="tbtn" id="svg" title="save the deal as a picture, SVG">SVG</button>
    <button class="tbtn" id="png" title="save the deal as a picture, PNG">PNG</button></span>
  <a id="back" href="#" style="display:none">&larr; back</a></div>
<div class="wrap"><div id="app"><div class="empty">No deal in the link.</div></div></div>
<script>
const SUIT={s:{sym:"♠",c:"sp"},h:{sym:"♥",c:"he"},d:{sym:"♦",c:"di"},c:{sym:"♣",c:"cl"}};
const ORDER="shdc";
const RANKV={A:14,K:13,Q:12,J:11,T:10,"9":9,"8":8,"7":7,"6":6,"5":5,"4":4,"3":3,"2":2};
const NEXT={n:"e",e:"s",s:"w",w:"n"};
const q=new URLSearchParams(location.search);
// Russian on lang=ru or in a Russian browser, English otherwise: seat letters and NT stay as they are
const RU=/^ru/i.test(q.get("lang")||navigator.language||""), T=(en,ru)=>RU?ru:en;
const NM=RU?{n:"Север",e:"Восток",s:"Юг",w:"Запад"}:{n:"North",e:"East",s:"South",w:"West"};
function trk(n){ return RU?`${n} взят${n%10===1&&n!==11?"ку":n%10>=2&&n%10<=4&&(n<12||n>14)?"ки":"ок"}`:`${n} trick${n===1?"":"s"}`; }
const gaveUp=n=>T(`gave up ${trk(n)} vs. double-dummy`,`отдал ${trk(n)} по double-dummy`);
if(RU){ document.documentElement.lang="ru"; document.title=document.querySelector(".top h1").textContent="Просмотр сдачи";
  document.getElementById("rotate").title="повернуть стол: следующая рука внизу";
  document.getElementById("print").title="напечатать сдачу";
  document.getElementById("svg").title="сохранить сдачу картинкой, SVG"; document.getElementById("png").title="сохранить сдачу картинкой, PNG";
  document.getElementById("back").innerHTML="&larr; назад"; document.querySelector(".empty").textContent="В ссылке нет сдачи."; }
// a= also comes run together, as in BBO's own handviewer links (ppp3NDppp, D and R for the doubles),
// and such a link gives the contract nowhere else: put the calls in our form and read c= and dl=
// out of them, so everything below sees an ordinary link. 3N and 3S x in c= are the same shorthand.
(function readAuction(){
  if(q.get("c")) q.set("c",q.get("c").replace(/\s+/g,"").replace(/^(\d)n(?!t)/i,"$1nt"));
  if(q.get("r")) q.set("r",q.get("r").replace(/^ /,"+"));                     // r=+1 sent unescaped
  if(q.get("l")) q.set("l",q.get("l").replace(/10$/,"t"));                    // l=c10 is ct
  const calls=(q.get("a")||"").replace(/\([^)]*\)/g,"").match(/[1-7](?:nt?|[cdhs])|xx|pass|[pxdr]/gi);
  if(!calls) return;
  let seat=(q.get("d")||"n").toLowerCase(), last="", dbl=""; if(!NM[seat]) seat="n";
  const first={}, side=s=>s==="n"||s==="s"?"ns":"ew";
  const out=calls.map(raw=>{ const c=raw.toLowerCase(), m=c.match(/^([1-7])(n|[cdhs])/); let call="p";
    if(m){ call=m[1]+(m[2]==="n"?"nt":m[2]); dbl=""; const k=side(seat)+m[2]; first[k]=first[k]||seat; last={call,k}; }
    else if(c==="x"||c==="d"){ call="x"; dbl="x"; }
    else if(c==="xx"||c==="r"){ call="xx"; dbl="xx"; }
    seat=NEXT[seat]; return call; });
  q.set("a",out.join("-"));
  if(last&&!q.get("c")){ q.set("c",last.call+dbl); if(!q.get("dl")) q.set("dl",first[last.k]); } })();
// pa=1 marks the baked p= line as the table's ACTUAL play (a results page hands it over that
// way); without it a baked line is the double-dummy one, which is a different claim entirely
const ACTUAL=q.get("pa")==="1";
// pl=<name>|<team>~... in N,E,S,W order — who actually sat there, when the link came from
// a protocol. Absent for a bare deal link, and then the seats stay anonymous.
const PL=(()=>{ const v=q.get("pl"); if(!v) return null;
  const out={}, parts=v.split("~");
  ["n","e","s","w"].forEach((s,i)=>{ const [nm,tm]=(parts[i]||"").split("|");
    if(nm) out[s]={n:nm,t:tm||""}; });
  return Object.keys(out).length?out:null; })();
// every value here comes from the URL and is attacker-controllable — escape anything that reaches
// innerHTML, and never trust a param verbatim in a tag or an href.
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function parseHand(str){ const out={s:"",h:"",d:"",c:""}; let cur=null;
  for(const ch of (str||"")){ const l=ch.toLowerCase();
    if(l==="s"||l==="h"||l==="d"||l==="c") cur=l;
    else if(cur && RANKV[ch.toUpperCase()]) out[cur]+=ch.toUpperCase(); }   // valid ranks only -> no injection
  return out; }
function suitSym(ch){ const l=ch.toLowerCase(); return SUIT[l]?`<span class="${SUIT[l].c}">${SUIT[l].sym}</span>`:esc(ch); }
function handHTML(h, seat){ return ORDER.split("").map(su=>{
    const cards=(h[su]||"").split("").map(r=>`<span class="card" data-c="${seat}${su}${r.toLowerCase()}">${r==="T"?"10":r}</span>`).join("");
    return `<div class="suit ${SUIT[su].c}"><span class="s">${SUIT[su].sym}</span>${cards||'<span style="color:#556">—</span>'}</div>`;
  }).join(""); }
function fmtContract(c){ const m=(c||"").match(/^(\d)(NT|[shdc])(x{0,2})/i); if(!m) return esc(c||"");
  const dbl=m[3]?` <span style="color:#ff9d5e">${m[3].toUpperCase()}</span>`:"";
  return `${m[1]}${m[2].toUpperCase()==="NT"?"NT":suitSym(m[2])}${dbl}`; }
function fmtPar(par){ const m=(par||"").match(/^(\d)(NT|[shdc])([nesw])?(.*)$/i); if(!m) return esc(par||"");
  const strain=m[2].toUpperCase()==="NT"?"NT":suitSym(m[2]);
  const decl=m[3]?`&nbsp;<span class="pardecl">${m[3].toUpperCase()}</span>`:"";
  return `${m[1]}${strain}${decl}${esc(m[4]||"")}`; }

function auctionHTML(a, dealer){
  const calls=a.split(/[-,]/).filter(x=>x!==""); const cols=["w","n","e","s"];
  const head="<tr>"+cols.map(c=>`<th>${c.toUpperCase()}</th>`).join("")+"</tr>";
  const cells=[]; for(let i=0;i<cols.indexOf(dealer);i++) cells.push('<td style="color:#3a4a63">·</td>');
  for(const c of calls) cells.push(`<td>${fmtCall(c)}</td>`);
  while(cells.length%4) cells.push("<td></td>");
  let rows=""; for(let i=0;i<cells.length;i+=4) rows+="<tr>"+cells.slice(i,i+4).join("")+"</tr>";
  return `<table class="auc">${head}${rows}</table>`; }
function fmtCall(c){ const u=c.toUpperCase();
  if(u==="P"||u==="PASS") return `<span class="call pass">${T("Pass","Пас")}</span>`;
  if(u==="X") return '<span class="call dbl">X</span>';
  if(u==="XX") return '<span class="call dbl">XX</span>';
  const m=c.match(/^(\d)(NT|[shdc])$/i);
  return m?`${m[1]}${m[2].toUpperCase()==="NT"?"NT":suitSym(m[2])}`:esc(u); }

let DEALER="n", VUL="-", PAR_NS=null;
function ddBox(dd){ const own=calcPar(dd,DEALER,VUL), par=q.get("par")||own, m=own.match(/NS ([+-]?\d+)$/);
  PAR_NS=own==="Passed out"?0:m?+m[1]:null;
  const shown=par==="Passed out"?T(par,"Все пас"):fmtPar(par);
  return `<div class="box ddbox"><h2>${T("Double-dummy — makeable tricks","Double-dummy — сколько взяток")}</h2>${ddHTML(dd)}${par?`<div class="par">${T("Par","Пар")}: <b>${shown}</b></div>`:""}</div>`; }
function ddHTML(dd){ const strains=["NT","s","h","d","c"], seats=["n","s","e","w"];
  const IDX={n:0,e:1,s:2,w:3};   // dd is packed seat-major N,E,S,W — map each display row to its block
  let g=`<table class="dd"><tr><th></th>${strains.map(s=>`<th>${s==="NT"?"NT":suitSym(s)}</th>`).join("")}</tr>`;
  seats.forEach(se=>{ g+=`<tr><th>${se.toUpperCase()}</th>`;
    strains.forEach((st,ti)=>{ const t=parseInt(dd[IDX[se]*5+ti],36);
      g+=`<td class="${t>=7?'make':'lo'}">${isNaN(t)?"":t}</td>`; });
    g+="</tr>"; });
  return g+"</table>"; }

// ---- par, when the link gives the grid but no par= ----
// Par is arithmetic on the makeable-tricks grid, no solver needed: from the dealer round the table
// each seat outbids (as declarer, on its own line of the grid) or passes, a contract that fails is
// doubled, and what both sides can force is par. Seats, not sides, take turns because when both
// sides can make the same contract the one that gets there first has it.
const DD_RE=/^[0-9a-d]{20}$/i, PAR_STRAINS="cdhsn", PAR_GRID={n:0,s:1,h:2,d:3,c:4};   // bid order -> column of the dd= grid
function contractScore(level, strain, tricks, vul){
  const down=level+6-tricks;
  if(down>0) return -(vul?300*down-100:down<4?200*down-100:300*down-400);
  const per=strain==="c"||strain==="d"?20:30, base=per*level+(strain==="n"?10:0);
  return base+per*(tricks-level-6)+(base>=100?(vul?500:300):50)
    +(level===6?(vul?750:500):level===7?(vul?1500:1000):0); }
function bridgeScore(level, strain, dbl, tricks, vul){                 // dbl: 0, 1 doubled, 2 redoubled
  const down=level+6-tricks, k=1<<dbl;
  if(down>0) return -(dbl?(k/2)*(vul?300*down-100:down<4?200*down-100:300*down-400):down*(vul?100:50));
  const per=strain==="c"||strain==="d"?20:30, base=(per*level+(strain==="n"?10:0))*k, over=tricks-level-6;
  return base+over*(dbl?(vul?100:50)*k:per)+50*dbl+(base>=100?(vul?500:300):50)
    +(level===6?(vul?750:500):level===7?(vul?1500:1000):0); }
// The only right card of a position, if it has one: every best card is in one suit, no live card
// sits between them (the ♥QJ are one card), and the hand holds something worse.
function onlyMove(ev, gone){ const keys=Object.keys(ev.cards), best=keys.filter(k=>ev.cards[k]===ev.best),
    rest=keys.filter(k=>ev.cards[k]<ev.best), rk="23456789tjqka";
  if(!best.length||!rest.length||best.some(k=>k[0]!==best[0][0])) return null;
  const at=best.map(k=>rk.indexOf(k[1])), lo=Math.min(...at), hi=Math.max(...at);
  for(let r=lo;r<=hi;r++) if(!at.includes(r)&&!gone.has(best[0][0]+rk[r])) return null;
  return {best, gap:ev.best-Math.max(...rest.map(k=>ev.cards[k])), share:rest.length/keys.length}; }
// The moments of a line worth stopping at: an only move, dearest first. The lead has its own tab,
// and the last two tricks leave too little to choose from.
function keyMoments(evs, keys, max=5){ const out=[];
  for(let i=1;i<Math.min(evs.length,44);i++){ const m=evs[i]&&onlyMove(evs[i],new Set(keys.slice(0,i))); if(m) out.push({i,...m}); }
  return out.sort((a,b)=>b.gap-a.gap||b.share-a.share||a.i-b.i).slice(0,max).sort((a,b)=>a.i-b.i); }
function calcPar(dd, dealer, vul){
  if(!DD_RE.test(dd||"")) return "";
  const seats="nesw", first=seats.indexOf(dealer), memo=new Map();
  const isVul=s=>vul==="b"||(vul==="n"&&s%2===0)||(vul==="e"&&s%2===1);
  const tricks=(s,b)=>parseInt(dd[s*5+PAR_GRID[PAR_STRAINS[b%5]]],36);
  const score=(b,s)=>{ const v=contractScore((b/5|0)+1,PAR_STRAINS[b%5],tricks(s,b),isVul(s)); return s%2?-v:v; };
  // best play from: highest bid b by seat owner, seat to act, passes since. Scores are NS's.
  function best(b,owner,seat,passes){
    if(passes===(b<0?4:3)) return b<0?{v:0,b:-1,s:0}:{v:score(b,owner),b,s:owner};
    const key=(b+1)*256+owner*64+seat*16+passes; if(memo.has(key)) return memo.get(key);
    const nx=(seat+1)%4, rival=b>=0&&(owner+seat)%2===1; let top=best(b,owner,nx,passes+1);
    for(let j=b+1;j<35;j++){ const r=best(j,seat,nx,0);     // lowest bid wins a tie
      // a rival takes a tie over passing, so the auction runs on to the contract nobody can move
      // (2♥+1, not 1♥+2 that 2♣x-1 could still dispute); a side never raises itself for nothing
      if(seat%2?r.v<top.v:r.v>top.v) top=r; else if(rival&&r.v===top.v&&top.b===b) top=r; }
    memo.set(key,top); return top; }
  const r=best(-1,0,first,0);
  if(r.b<0) return "Passed out";
  // partners take turns, so the level reached can hang on whose turn it was: name the lowest level
  // with this score that no rival gains by outbidding, which is how par names a contract. A rival
  // ahead of declarer in the rotation can also take that very bid first.
  let bid=r.b, decl=r.s; const opp=[(r.s+1)%4,(r.s+3)%4], turn=s=>(s-first+4)%4;
  const beaten=(b,p)=>{ for(let j=b;j<35;j++) for(const o of opp)
    if((j>b||turn(o)<turn(p))&&(r.s%2?score(j,o)>r.v:score(j,o)<r.v)) return true; return false; };
  search: for(let l=bid%5;l<35;l+=5) for(const p of [r.s,(r.s+2)%4])
    if(score(l,p)===r.v&&!beaten(l,p)){ bid=l; decl=p; break search; }
  const lvl=(bid/5|0)+1, st=PAR_STRAINS[bid%5], diff=tricks(decl,bid)-lvl-6;
  return `${lvl}${st==="n"?"nt":st}${seats[decl]}${diff<0?"x"+diff:diff?"+"+diff:"="} NS ${r.v>0?"+":""}${r.v}`; }

// API_DEFAULT on this site, once the page is up (findAPI).
const API_DEFAULT="/api/ddline";

let BLIND=q.get("blind")==="1", SEQ=null, POS=Math.max(0,parseInt(q.get("pos"))||0), PLAYMODE=q.get("task")==="1"?"task":q.get("quiz")==="1"?"quiz":q.has("pos")||ACTUAL&&!q.has("at")&&!BLIND?"dd":"ip", IP=null, HANDS=null, DECL="", LEADER0="", TRUMP="NT";

let NEED=7, CAN_IP=false, AUTO=null;
function stopAuto(){ if(AUTO){ clearInterval(AUTO); AUTO=null; } }
let bottomSeat="s"; const RHO={n:"w",w:"s",s:"e",e:"n"};   // rotate: which seat sits at the bottom
function applyRotation(){                                   // place seats around the fixed centre
  const B=bottomSeat, pos={[B]:[2,3],[NEXT[B]]:[1,2],[PARTNER[B]]:[2,1],[RHO[B]]:[3,2]};   // bot,left,top,right
  for(const s of ["n","e","s","w"]){ const el=document.querySelector(".seat."+s);
    if(el&&pos[s]){ el.style.gridColumn=pos[s][0]; el.style.gridRow=pos[s][1]; } } }
function buildSeq(cards){ if(!cards||!cards.length) return null;
  const decl=(q.get("dl")||"s").toLowerCase(); let cur=NEXT[decl];
  const tm=(q.get("c")||"NT").match(/(NT|[shdc])/i); const trump=tm?tm[1].toUpperCase():"NT";
  const seq=[]; let trick=[];
  for(const card of cards){ seq.push({card,who:cur}); trick.push({card,who:cur});
    if(trick.length===4){ cur=winner(trick,trump); trick=[]; } else cur=NEXT[cur]; }
  return seq; }
function winner(trick, trump){ const led=trick[0].card[0].toLowerCase(), tr=trump.toLowerCase();
  const v=card=>{ const su=card[0].toLowerCase(), r=RANKV[card.slice(1).toUpperCase()]||0;
    return su===tr?200+r:(su===led?100+r:r); };
  let best=trick[0]; for(const t of trick) if(v(t.card)>v(best.card)) best=t; return best.who; }
function cardEl(card, who){ return document.querySelector(`.card[data-c="${who}${card.toLowerCase()}"]`); }
function leadEl(){ const l=q.get("l")||""; return CARD_RE.test(l)?cardEl(l,LEADER0):null; }   // the l= card in its hand
function cardHTML(card){ const su=(card||"")[0]?card[0].toLowerCase():"", r=(card||"").slice(1).toUpperCase();
  if(!SUIT[su]) return esc(card); return `${suitSym(su)}${r==="T"?"10":esc(r)}`; }
// The api= URL comes from the link too, so its answers are as untrusted as any param: keep only
// what really is a card ('c7','hT') or a trick count before any of it reaches the page.
const CARD_RE=/^[shdc][2-9tjqka]$/i;
function cardList(a){ return Array.isArray(a)?a.filter(c=>typeof c==="string"&&CARD_RE.test(c)):[]; }
function evalOf(j){ const tricks=v=>Number.isInteger(v)&&v>=0&&v<=13;
  if(!j||(j.side!=="ns"&&j.side!=="ew")||!tricks(j.best)||!j.cards||typeof j.cards!=="object") return null;
  const cards={}; for(const [k,v] of Object.entries(j.cards)) if(CARD_RE.test(k)&&tricks(v)) cards[k.toLowerCase()]=v;
  return Object.keys(cards).length?{side:j.side,best:j.best,cards}:null; }
// the current trick laid out on the "table" (centre), each card at its player's seat direction
// (following the rotation) — so plays stay visible even when the played hand is hidden face-down.
function renderTableCards(trick, winSeat){
  const box=document.querySelector(".tablecards"); if(!box) return;
  const B=bottomSeat, pos={[B]:"bottom",[NEXT[B]]:"left",[PARTNER[B]]:"top",[RHO[B]]:"right"};
  const slots={top:"",bottom:"",left:"",right:""};
  for(const t of (trick||[])){ const p=pos[t.who]; if(p) slots[p]=cardHTML(t.card); }
  const wp=winSeat?pos[winSeat]:null;
  box.querySelectorAll(".tc").forEach(el=>{ const p=el.dataset.pos;
    el.innerHTML=slots[p]||""; el.classList.toggle("win", p===wp && !!slots[p]); }); }

function vulText(v){ return {"-":T("None","нет"),n:"N-S",e:"E-W",b:T("All","все")}[v]||T("None","нет"); }
function render(){

  const contract=q.get("c")||"", result=q.get("r")||"";
  const decl=(q.get("dl")||"").toLowerCase(), leader=decl?NEXT[decl]:"";
  const vt=vulText(vul);

  // state for interactive play (#5): the four hands, the trump, declarer and opening leader

  DEALER=dealer; VUL=vul;
  if(q.get("dd")) panels+=ddBox(q.get("dd"));

  SEQ=buildSeq(cardList((q.get("p")||"").split(/[ ,]+/)));

  app.innerHTML=comp+panels+playbox+
    `<div class="note">${T("Four-colour suits","Четырёхцветные масти")} · ${ACTUAL?T("the line shown is the table’s actual card play","показан реальный розыгрыш за столом"):T("the line shown is double-dummy optimal, not the table’s actual play","показана линия double-dummy, а не розыгрыш за столом")}<br>${T("Keys — both tabs: <b>←</b>/<b>→</b> step, <b>↓</b> trick, <b>Home</b>/<b>End</b> start and end · line: <b>space</b> auto · play: <b>R</b> restart, <b>B</b> best line, <b>C</b> claim","Клавиши — обе вкладки: <b>←</b>/<b>→</b> шаг, <b>↓</b> взятка, <b>Home</b>/<b>End</b> начало и конец · линия: <b>пробел</b> авто · игра: <b>R</b> сначала, <b>B</b> лучшая линия, <b>C</b> клейм")}</div>`;
  const bd=/^\d+$/.test(q.get("b")||"")?q.get("b"):"";                 // digits only: it reaches innerHTML

async function taskFind(){ if(taskBusy) return; taskBusy=true;

// The table's play against double-dummy: what each card gave away. All 48 cards before the last
// trick are one request each, a few at a time; the answers are cached by server and browser alike.
let AUDIT=null, jumpPlay=null;
async function evalCards(keys,say){ const evs=[], n=Math.min(keys.length,48); let next=0, asked=0;
  const worker=async()=>{ while(next<n){ const i=next++;
    for(let t=0;;t++) try{ evs[i]=evalOf(await (await fetch(apiURL({played:keys.slice(0,i).join(",")}))).json()); break; }
      catch(e){ if(t===2){ next=n; break; } await new Promise(r=>setTimeout(r,2000)); }   // the limit of the proxy; then it is down
    say(++asked,n); } };
  await Promise.all([worker(),worker(),worker()]); return evs; }
// the line of the deal is walked once, whoever asks: the audit and the task want the same answers
let LINE_EVS=null; const lineSay=[];
function lineEvals(keys,say){ lineSay.push(say); return LINE_EVS=LINE_EVS||evalCards(keys,(a,n)=>lineSay.forEach(f=>f(a,n))); }
async function auditCards(keys,say,get=evalCards){ const costs=[], evs=await get(keys,(a,n)=>say(`${T("Checking the play","Проверяю розыгрыш")}… ${a}/${n}`));
  evs.forEach((ev,i)=>{ const v=ev&&ev.cards[keys[i]]; if(v!=null) costs[i]=ev.best-v; }); return costs; }
function auditHTML(costs,keys,who,mine){ const got=Object.keys(costs).length; if(!got) return "";

  return (errs.length?`<b>${T("Where tricks went","Где ушли взятки")}:</b> `+errs.map(i=>
      `<button data-at="${i+1}" title="${T("go to this card","к этой карте")}">${Math.floor(i/4)+1}: ${who[i].toUpperCase()} ${cardHTML(keys[i])} −${costs[i]}</button>`).join(" ")
    :T("No card gave a trick away.","Ни одна карта не отдала взятку."))+(got<Math.min(keys.length,48)?` ${T("(not every card checked)","(проверены не все карты)")}`:""); }
async function auditPlay(){ const box=document.getElementById("playbox");

async function blindReview(){ const keys=[...IP.seq], who=IP.hist.map(h=>h.turn), run=IP.review={keys,html:""};
  const say=h=>{ run.html=h; const el=document.getElementById("ipaudit"); if(el&&IP.review===run) el.innerHTML=h; };

  if(!API||!c||!dl){ note(none); return; }

function wirePlay(){
  const paint=()=>{
    document.querySelectorAll('.card').forEach(c=>c.classList.remove('played','now'));
    for(let i=0;i<POS;i++){ const el=cardEl(SEQ[i].card,SEQ[i].who); if(el) el.classList.add(i===POS-1?'now':'played'); }
    const ts=POS?Math.floor((POS-1)/4)*4:0, shown=SEQ.slice(ts,POS);
    let win=-1; if(shown.length===4){ const w=winner(shown,TRUMP); win=shown.findIndex(x=>x.who===w); }
    document.getElementById('ptv').innerHTML=shown.map((x,i)=>
      `<span class="pc${i===win?' win':''}"><span class="who">${x.who.toUpperCase()}</span>${cardHTML(x.card)}</span>`).join("");
    renderTableCards(shown, shown.length===4?winner(shown,TRUMP):null);
    // running trick count: how many COMPLETED tricks each side has taken so far, and where
    // that leaves the declarer against the contract — the same reading the interactive tab gives
    let ns=0, ew=0;
    for(let i=0; i+4<=POS; i+=4){ const w=winner(SEQ.slice(i,i+4),TRUMP);
      if(w==="n"||w==="s") ns++; else ew++; }
    const dside=(DECL==="n"||DECL==="s")?"ns":"ew", dt=dside==="ns"?ns:ew;
    const done=POS>=SEQ.length&&SEQ.length%4===0, d=dt-NEED, dw=T("declarer","разыгрывающий");
    document.getElementById('ptk').textContent=
      `${T("card","карта")} ${POS}/${SEQ.length} \u00b7 ${T("trick","взятка")} ${Math.max(1,Math.ceil(POS/4))}/${Math.ceil(SEQ.length/4)}`
      + ` \u00b7 N-S ${ns} \u2013 E-W ${ew}`
      + (done ? ` \u00b7 ${dw} ${dt} (${resText(d)})`+(SEQ.length===52?scoreLine(dt):"")
              : ` \u00b7 ${dw} ${dt}, ${T("needs","нужно")} ${NEED}`);
    const lost=AUDIT&&POS?AUDIT[POS-1]:0;
    document.getElementById('pfb').textContent=lost>0?`▲ ${NM[SEQ[POS-1].who]} ${gaveUp(lost)}`:"";
    document.getElementById('pp').disabled=POS===0; document.getElementById('pf').disabled=POS===0;
    document.getElementById('pn').disabled=POS>=SEQ.length; document.getElementById('pt').disabled=POS>=SEQ.length;
  };
  const step=n=>{ POS=Math.max(0,Math.min(SEQ.length,POS+n)); paint(); };
  document.getElementById('pn').onclick=()=>step(1);
  document.getElementById('pp').onclick=()=>step(-1);
  document.getElementById('pf').onclick=()=>{POS=0;paint();};
  document.getElementById('pt').onclick=()=>step(Math.min(SEQ.length,(Math.floor(POS/4)+1)*4)-POS);
  document.getElementById('pa').onclick=function(){
    const label=`▶ ${T("auto","авто")}`;
    if(AUTO){stopAuto();this.textContent=label;return;}
    this.textContent=`⏸ ${T("pause","пауза")}`;
    AUTO=setInterval(()=>{ if(POS>=SEQ.length){stopAuto();document.getElementById('pa').textContent=label;return;} step(1); },750);
  };
  document.getElementById('plink').onclick=function(){ copyLink(this,"pos",POS?""+POS:""); };
  jumpPlay=p=>{ POS=p; paint(); };

}

    <button class="tr" id="trhide" title="${T("hide the hands the double-dummy plays (dummy stays shown)","скрыть руки, которыми играет double-dummy (болван остаётся)")}">${T("hide DD hands","скрыть руки DD")}</button>
    <button class="tr" id="trblind" title="${T("play declarer from your two hands; no hints until the last card","разыгрывать, видя только свои две руки; без подсказок до последней карты")}">${T("blind","вслепую")}</button></div>
  <div class="play"><button id="ipstart" title="${T("back to the first card, keeping the line ahead","к первой карте, линия впереди сохраняется")}">⏮</button>
    <button id="ipu" title="${T("one card back","на карту назад")}">◀</button>
    <button id="ipf" title="${T("one card forward, along the line ahead or the double-dummy-optimal one","на карту вперёд: по линии впереди или по линии double-dummy")}">▶</button>
    <button id="iptrick" title="${T("to the end of this trick","до конца взятки")}">${T("trick","взятка")} ▶▶</button>
    <button id="ipr">⟲ ${T("restart","сначала")}</button>
    <button id="ipbest" title="${T("play out the double-dummy-optimal line from here to the end","доиграть отсюда до конца по линии double-dummy")}">${T("best line","лучшая линия")} ▶</button>
    <button id="ipclaim" title="${T("claim — finish the hand double-dummy instantly and show the result","клейм: сразу доиграть по double-dummy и показать итог")}">${T("claim","клейм")} ✓</button>
    <button id="ddonce" title="${T("show the double-dummy result of every card in the hand on turn, once","один раз показать результат double-dummy для каждой карты руки на ходу")}">${T("show DDS","показать DDS")}</button>
    <button id="ddauto" title="${T("keep the DDS of the hand on turn shown every trick, until turned off","показывать DDS руки на ходу на каждой взятке, пока не выключите")}">${T("auto DDS","авто DDS")}</button>
    ${LINK_BTN}
    <span class="tk" id="iptk"></span></div>
  <div class="trick" id="iptv"></div>
  <div class="ipth" id="ipth"></div>
  <div class="ipdd" id="ipdd"></div>
  <div class="ipfb" id="ipfb"></div>
  <div id="ipaudit"></div>
  <div class="ipmsg blindonly">${T("Blind: you see your two hands only. The defenders play double-dummy, so they see all four hands and never slip. The review opens after the last card.","Вслепую: вы видите только свои две руки. Защита играет по double-dummy, то есть видит все четыре руки и не ошибается. Разбор откроется после последней карты.")}</div>
  <div class="ipmsg">${T("Click a card in the highlighted hand — follow-suit is enforced and the lead passes to the trick winner. The mark on a card is the double-dummy contract result if you play it (=/+1/-1) — green makes, red goes down.","Нажмите карту в выделенной руке: вьювер следит за мастью, а ход переходит к взявшему взятку. Метка на карте — результат контракта по double-dummy, если сыграть её (=/+1/-1): зелёная — контракт выполнен, красная — не выполнен.")}</div>`;
function clearBoard(){ document.querySelectorAll('.card').forEach(c=>c.classList.remove('played','now','legal'));
  document.querySelectorAll('.seat').forEach(s=>s.classList.remove('toplay'));
  document.querySelectorAll('.card .ddv').forEach(s=>s.remove()); }
function ipInit(){ IP={rem:{},trick:[],seq:[],leader:LEADER0,turn:LEADER0,ns:0,ew:0,hist:[],redo:[],review:null,done:false,eval:null,curOpt:null,prevOpt:null,moveBy:null,lastMsg:"",solving:false};
  for(const s of ["n","e","s","w"]){ IP.rem[s]=new Set();
    for(const su of "shdc") for(const r of (HANDS[s][su]||"")) IP.rem[s].add(su+r.toLowerCase()); } }
function ipSnap(){ return {rem:{n:[...IP.rem.n],e:[...IP.rem.e],s:[...IP.rem.s],w:[...IP.rem.w]},
  trick:IP.trick.map(t=>({...t})),seq:[...IP.seq],leader:IP.leader,turn:IP.turn,ns:IP.ns,ew:IP.ew,done:IP.done}; }
function ipRestore(s){ IP.rem={n:new Set(s.rem.n),e:new Set(s.rem.e),s:new Set(s.rem.s),w:new Set(s.rem.w)};
  IP.trick=s.trick.map(t=>({...t}));IP.seq=[...s.seq];IP.leader=s.leader;IP.turn=s.turn;IP.ns=s.ns;IP.ew=s.ew;
  IP.done=s.done;IP.eval=null;IP.curOpt=null;IP.prevOpt=null;IP.moveBy=null;IP.lastMsg="";IP.solving=false;clearTimeout(autoTimer); }
function ipLegal(seat,key,trick){ if(!IP.rem[seat].has(key)) return false;
  if(!trick.length) return true; const led=trick[0].card[0]; if(key[0]===led) return true;
  for(const k of IP.rem[seat]) if(k[0]===led) return false; return true; }   // void in led suit -> anything
function ipPlay(key, paint=true){ if(IP.done||!ipTab()) return;
  const stale=IP.trick.length===4, eff=stale?[]:IP.trick, seat=IP.turn;      // a completed trick stays shown
  if(!ipLegal(seat,key,eff)) return;                                          // until the next card is led
  if(IP.redo[IP.redo.length-1]===key) IP.redo.pop(); else IP.redo=[];         // a different card leaves the line
  IP.hist.push(ipSnap());
  if(stale) IP.trick=[];
  IP.rem[seat].delete(key); IP.trick.push({card:key,who:seat}); IP.seq.push(key);
  // remember the optimal we're leaving; this card's cost = how far the optimal shifts once the DD
  // of the new position returns (works whether or not the pre-move eval had loaded yet)
  IP.prevOpt=IP.curOpt; IP.moveBy=seat; IP.curOpt=null; IP.eval=null; IP.lastMsg=""; ddsOnce=false;
  if(IP.trick.length===4){ const w=winner(IP.trick,TRUMP);
    if(w==="n"||w==="s") IP.ns++; else IP.ew++;
    IP.leader=w; IP.turn=w; if(IP.ns+IP.ew===13) IP.done=true; }
  else IP.turn=NEXT[seat];
  if(paint) ipPaint(); }
function ipPaint(){ if(!ipTab()) return; clearBoard(); clearTimeout(autoTimer);
  if(BLIND&&IP.done&&(!IP.review||IP.review.keys.join()!==IP.seq.join())) blindReview();
  document.body.classList.toggle('blind',!!veiled());
  const rv=document.getElementById('ipaudit');
  if(rv) rv.innerHTML=IP.review&&IP.review.keys.join().startsWith(IP.seq.join())?IP.review.html:"";
  const eff=IP.trick.length===4?[]:IP.trick;
  ["n","e","s","w"].forEach(s=>{ const el=document.querySelector('.seat.'+s);
    if(el) el.classList.toggle('facedown', isHidden(s)); });                 // single-dummy: hide DD hands
  for(const s of ["n","e","s","w"]) document.querySelectorAll(`.seat.${s} .card`).forEach(el=>{
    if(!IP.rem[s].has(el.getAttribute('data-c').slice(1))) el.classList.add('played'); });
  if(IP.trick.length){ const last=IP.trick[IP.trick.length-1], el=cardEl(last.card,last.who);
    if(el){ el.classList.remove('played'); el.classList.add('now'); } }
  let legalKeys=[];
  if(!IP.done){ const st=document.querySelector(`.seat.${IP.turn}`); if(st) st.classList.add('toplay');
    document.querySelectorAll(`.seat.${IP.turn} .card`).forEach(el=>{ const key=el.getAttribute('data-c').slice(1);
      if(IP.rem[IP.turn].has(key)&&ipLegal(IP.turn,key,eff)){ el.classList.add('legal'); legalKeys.push(key); } }); }
  let iwin=-1; if(IP.trick.length===4){ const w=winner(IP.trick,TRUMP); iwin=IP.trick.findIndex(t=>t.who===w); }
  document.getElementById('iptv').innerHTML=IP.trick.map((t,i)=>
    `<span class="pc${i===iwin?' win':(i===IP.trick.length-1&&IP.trick.length<4?' lead':'')}"><span class="who">${t.who.toUpperCase()}</span>${cardHTML(t.card)}</span>`).join("");
  const th=document.getElementById('ipth'); if(th) th.innerHTML=ipHistoryHTML();
  renderTableCards(IP.trick, IP.trick.length===4?winner(IP.trick,TRUMP):null);
  const declSide=(DECL==="n"||DECL==="s")?"ns":"ew", dt=declSide==="ns"?IP.ns:IP.ew;
  const tk=document.getElementById('iptk');
  if(IP.done){ const res=resText(dt-NEED); tk.textContent=T(`Done · declarer ${trk(dt)} (${res}), needed ${NEED}`,`Готово · разыгрывающий взял ${trk(dt)} (${res}), нужно ${NEED}`)+scoreLine(dt); }
  else tk.textContent=T(`${NM[IP.turn]} to play · declarer ${dt}, needs ${NEED}`,`Ходит ${NM[IP.turn]} · разыгрывающий ${dt}, нужно ${NEED}`)+` · NS ${IP.ns}–EW ${IP.ew}`;
  const noneAhead=!IP.redo.length&&(!API||IP.done);
  ['ipu','ipstart'].forEach(id=>{ const b=document.getElementById(id); if(b) b.disabled=IP.hist.length===0; });
  ['ipf','iptrick'].forEach(id=>{ const b=document.getElementById(id); if(b) b.disabled=noneAhead; }); ipSyncSolve();
  const fb=document.getElementById('ipfb'); if(fb) fb.textContent=IP.lastMsg||"";
  const dd0=document.getElementById('ipdd');
  if(IP.curOpt!=null) ipShowEval(); else if(dd0) dd0.innerHTML="";
  if(!IP.done&&!IP.solving&&!IP.redo.length&&!isAuto(IP.turn)&&legalKeys.length===1){   // one legal card -> auto-play it
    const only=legalKeys[0], forLen=IP.seq.length; clearTimeout(autoTimer);
    autoTimer=setTimeout(()=>{ if(IP.seq.length===forLen&&!IP.done&&!IP.solving) ipPlay(only); }, 360); }
  ipFetchEval(); }
function ipHistoryHTML(){                                   // compact scrollable log of completed tricks
  if(!IP||IP.seq.length<4) return "";
  let cur=LEADER0, trick=[], out=[], n=0;
  for(const card of IP.seq){ trick.push({who:cur,card});
    if(trick.length===4){ const w=winner(trick,TRUMP); n++;
      out.push(`<span class="tht" title="${T(`trick ${n} — won by ${NM[w]}`,`взятка ${n}, взял ${NM[w]}`)}"><span class="thn">${n}</span>`+
        trick.map(c=>`<span class="thc${c.who===w?' w':''}">${c.who.toUpperCase()[0]}${cardHTML(c.card)}</span>`).join("")+`</span>`);
      cur=w; trick=[]; } else cur=NEXT[cur]; }
  return out.length?`<span class="thlab">${T("played","сыграно")}</span>`+out.join(""):""; }
// double-dummy from the current position (via the caching API): the optimal declarer total from
// here, and — when you play an off-best card — how many tricks it just threw. Silent without the API.
let ipEvalTok=0, ddsAuto=false, ddsOnce=false;              // ddsAuto persists across restart; ddsOnce is per-hand
// trainer: you play some seats, the double-dummy plays the rest (auto), optionally hiding its hands
let youPlay=BLIND?'decl':'all', hideDD=false, autoTimer=null;
const PARTNER={n:'s',s:'n',e:'w',w:'e'};
function dummySeat(){ return PARTNER[(q.get('dl')||'').toLowerCase()]; }   // declarer's partner
function humanSeats(){ const d=(q.get('dl')||'').toLowerCase();
  if(!(d==='n'||d==='e'||d==='s'||d==='w')) return null;
  const decl=new Set([d,PARTNER[d]]);
  if(youPlay==='decl') return decl;                        // you = declarer + dummy
  if(youPlay==='def') return new Set(['n','e','s','w'].filter(s=>!decl.has(s)));   // you = both defenders
  return null; }                                           // 'all' -> null (every seat is yours)
function isAuto(seat){ const h=humanSeats(); return PLAYMODE!=="task" && !!h && !h.has(seat); }         // played by the DD
function isHidden(seat){ if(PLAYMODE==="task") return veiled()&&seat!==IP.turn&&seat!==dummySeat()&&!(IP.turn===dummySeat()&&seat===DECL);
  return (BLIND?!(IP&&IP.review):hideDD) && isAuto(seat) && seat!==dummySeat(); }    // dummy always shown
function ipClearDDV(){ document.querySelectorAll('.card .ddv').forEach(s=>s.remove()); }
function ipRenderDDV(){                                       // annotate the on-turn hand's legal cards
  ipClearDDV();
  if(!(ddsAuto||ddsOnce)||!IP||!IP.eval||IP.done||isHidden(IP.turn)||veiled()) return;
  document.querySelectorAll(`.seat.${IP.turn} .card.legal`).forEach(el=>{
    const v=IP.eval.cards[el.getAttribute('data-c').slice(1)]; if(v==null) return;
    const d=declTotal(v, IP.eval.side)-NEED;                  // contract result if this card is played
    const s=document.createElement('sup'); s.className='ddv '+(d<0?'set':'made');
    s.textContent=d===0?'=':(d>0?'+'+d:''+d); el.appendChild(s); }); }
function ipSyncDDSbtns(){ const a=document.getElementById('ddauto'); if(a) a.classList.toggle('on', ddsAuto);
  const o=document.getElementById('ddonce'); if(o) o.disabled=ddsAuto; }
function declTotal(sideTricks, side){                        // side's remaining DD tricks -> declarer total
  const declSide=(DECL==="n"||DECL==="s")?"ns":"ew", declWon=declSide==="ns"?IP.ns:IP.ew;
  const remaining=13-(IP.ns+IP.ew);
  return declWon+(side===declSide?sideTricks:(remaining-sideTricks)); }
function ipShowEval(){ const dd=document.getElementById('ipdd'); if(!dd||IP.curOpt==null) return;
  const df=IP.curOpt-NEED;
  dd.innerHTML=`${T("Double-dummy from here: declarer makes","Double-dummy отсюда: разыгрывающий берёт")} <b>${IP.curOpt}</b> (${resText(df)})`; }
async function ipFetchEval(){
  const dd=document.getElementById('ipdd');
  const tok=++ipEvalTok; if(!dd||IP.solving) return;       // during a best-line play-out, don't churn evals
  if(!API||IP.done){ dd.innerHTML=""; return; }
  const forLen=IP.seq.length;
  if(IP.curOpt==null) dd.innerHTML=`<span class="ipdim">${T("computing double-dummy…","считаю double-dummy…")}</span>`;
  try{
    const r=await fetch(apiURL({played:IP.seq.join(",")})); const j=await r.json();
    if(tok!==ipEvalTok||!ipTab()) return;                   // a newer position (or tab) superseded this fetch
    const ev=evalOf(j);
    if(!ev){ if(IP.curOpt==null) dd.innerHTML=""; return; }
    IP.eval={forLen,...ev};
    const opt=declTotal(ev.best,ev.side);
    if(IP.moveBy&&IP.prevOpt!=null){ const cost=Math.abs(opt-IP.prevOpt);   // shift in the optimal = what the card cost
      IP.lastMsg = cost>0 ? `▲ ${NM[IP.moveBy]} ${gaveUp(cost)}` : "";
      IP.moveBy=null; const fb=document.getElementById('ipfb'); if(fb) fb.textContent=IP.lastMsg; }
    IP.curOpt=opt; ipShowEval(); ipRenderDDV();
    if(isAuto(IP.turn)&&!IP.done&&!IP.solving&&!IP.redo.length){   // this seat is the DD's — it plays after a beat
      const forLen=IP.seq.length; clearTimeout(autoTimer);
      autoTimer=setTimeout(()=>{ if(IP.seq.length!==forLen||IP.done||!isAuto(IP.turn)||!IP.eval) return;
        const lead=BLIND&&!IP.seq.length?(q.get("l")||"").toLowerCase():"";
        const best=IP.eval.cards[lead]!=null?lead:Object.keys(IP.eval.cards).find(k=>IP.eval.cards[k]===IP.eval.best);
        if(best) ipPlay(best); }, 650); }
  }catch(e){ if(tok!==ipEvalTok) return; if(IP.curOpt==null) dd.innerHTML="";
    if(isAuto(IP.turn)&&!IP.done){ clearTimeout(autoTimer); autoTimer=setTimeout(ipFetchEval,2000); } } }
function ipBack(){ const key=IP.seq[IP.seq.length-1]; ipRestore(IP.hist.pop()); IP.redo.push(key); }
function wireInteractive(){
  if(!IP){ ipInit(); cardList((q.get("at")||"").split(/[ ,]+/)).forEach(k=>ipPlay(k.toLowerCase(),false)); }
  // stepping through a line: while there are cards ahead (IP.redo) nothing plays by itself
  document.getElementById('ipu').onclick=()=>{ if(IP.hist.length){ ipBack(); ipPaint(); } };
  document.getElementById('ipstart').onclick=()=>{ if(IP.hist.length){ while(IP.hist.length) ipBack(); ipPaint(); } };
  document.getElementById('ipf').onclick=ipForward;
  document.getElementById('iptrick').onclick=ipTrick;
  document.getElementById('plink').onclick=function(){ copyLink(this,"at",IP.seq.join(",")); };
  document.getElementById('ipaudit').onclick=e=>{ const b=e.target.closest('button[data-at]'); if(b) ipJump(+b.dataset.at); };
  document.getElementById('ipr').onclick=()=>{ ddsOnce=false; clearTimeout(autoTimer); ipInit(); ipPaint(); };
  const bo=document.getElementById('ddonce'), ba=document.getElementById('ddauto'), bl=document.getElementById('ipbest'),
        bc=document.getElementById('ipclaim');
  if(!API){ [bo,ba,bl,bc].forEach(x=>{ if(x) x.style.display='none'; }); }          // DDS + solver need the eval API
  else { bo.onclick=()=>{ ddsOnce=true; ipRenderDDV(); };
    ba.onclick=()=>{ ddsAuto=!ddsAuto; ddsOnce=false; ipSyncDDSbtns(); ipRenderDDV(); };
    if(bl) bl.onclick=ipBestLine; if(bc) bc.onclick=ipClaim; }
  document.querySelectorAll('.tr[data-you]').forEach(b=>b.onclick=()=>{ IP.solving=false; BLIND=false; youPlay=b.dataset.you; ipSyncTrainer(); ipPaint(); });
  const th=document.getElementById('trhide'); if(th) th.onclick=()=>{ IP.solving=false; hideDD=!hideDD; ipSyncTrainer(); ipPaint(); };
  document.getElementById('trblind').onclick=()=>{ IP.solving=false; BLIND=!BLIND;   // on: from the first card, as nothing was seen
    if(BLIND){ youPlay='decl'; ddsOnce=false; ipInit(); } ipSyncTrainer(); ipPaint(); };
  ipSyncTrainer(); ipSyncDDSbtns(); ipPaint(); }
function ipSyncTrainer(){
  document.querySelectorAll('.tr[data-you]').forEach(b=>b.classList.toggle('on', b.dataset.you===youPlay));
  const th=document.getElementById('trhide'); if(th){ th.classList.toggle('on', hideDD); th.style.display=youPlay==='all'||BLIND?'none':''; }
  const tb=document.getElementById('trblind'); if(tb) tb.classList.toggle('on', BLIND);
  const row=document.querySelector('.iptr'); if(row) row.style.display=API?'':'none'; }   // trainer needs the eval API
function ipSyncSolve(){ const b=document.getElementById('ipbest'); if(!b) return;
  b.textContent=IP.solving?`⏹ ${T('stop','стоп')}`:`${T('best line','лучшая линия')} ▶`; b.classList.toggle('on', IP.solving);
  b.disabled=IP.done&&!IP.solving; }
// play out the DD-optimal line from the current position to the end (one API call for the whole
// continuation, then animate it locally). Click again to stop; ◀/▶/restart/mode change also stop,
// and ▶ then goes on along the same line card by card.
async function ipBestLine(){
  if(!API) return;
  if(IP.solving){ IP.solving=false; ipPaint(); return; }
  if(IP.done) return;
  IP.solving=true; ipSyncSolve(); clearTimeout(autoTimer);
  const forLen=IP.seq.length, line=await fetchContinuation();
  if(!IP.solving||IP.seq.length!==forLen){ IP.solving=false; clearTimeout(autoTimer); ipSyncSolve(); return; }
  if(!line.length){ IP.solving=false; ipPaint(); return; }
  IP.redo=[...line].reverse();
  let i=0;
  const step=()=>{ if(!IP.solving||IP.done||i>=line.length){ IP.solving=false; ipSyncSolve(); return; }
    ipPlay(line[i++]);
    if(IP.solving&&!IP.done&&i<line.length) autoTimer=setTimeout(step, 430);
    else { IP.solving=false; ipSyncSolve(); } };
  step();
}
// ▶: the next card of the line ahead; with none ahead, the best line from here becomes that line
async function ipForward(){
  IP.solving=false; clearTimeout(autoTimer);
  if(!IP.redo.length){ if(!API||IP.done) return;
    const ip=IP, at=IP.seq.join(), line=await fetchContinuation();
    if(PLAYMODE!=="ip"||IP!==ip||IP.seq.join()!==at||IP.redo.length) return;
    IP.redo=[...line].reverse(); }
  if(IP.redo.length) ipPlay(IP.redo[IP.redo.length-1]); else ipPaint();       // no line: the DD's turn comes back
}
// ▶▶: on to the end of this trick · End: on to the end of the line
async function ipTrick(){ const ip=IP;
  do{ const n=IP.seq.length; await ipForward(); if(IP!==ip||IP.seq.length===n) return; }while(!IP.done&&IP.trick.length<4); }
async function ipEnd(){ const ip=IP; if(!IP.redo.length) await ipForward();
  if(PLAYMODE!=="ip"||IP!==ip) return; IP.solving=false; clearTimeout(autoTimer);
  while(IP.redo.length&&!IP.done){ const n=IP.seq.length; ipPlay(IP.redo[IP.redo.length-1],false); if(IP.seq.length===n) break; }
  ipPaint(); }
// claim: finish the hand double-dummy instantly (fetch the continuation, apply it all at once)
async function ipClaim(){
  if(!API||IP.done||IP.solving) return;
  clearTimeout(autoTimer);
  IP.solving=true; const forLen=IP.seq.length, line=await fetchContinuation();
  if(IP.solving&&IP.seq.length===forLen){ for(const k of line){ if(IP.done) break; ipPlay(k, false); } }   // paint once, below
  IP.solving=false; if(PLAYMODE==="ip") ipPaint();
}
document.addEventListener('click',e=>{ const el=e.target.closest('.card.legal'); if(!el) return;
  const key=el.getAttribute('data-c').slice(1);
  if(PLAYMODE==='quiz'){ if(!QUIZ) quizPick(key); } else if(PLAYMODE==='task') taskPick(key); else if(PLAYMODE==='ip'&&IP&&!IP.solving) ipPlay(key); });
// keyboard: both tabs ← → step, ↓ trick, ↑/Home first card, End last · DD-line space auto · interactive
// backspace and U too step back, R restart, B best line. Only while the play panel is up; clicks the same (visible, enabled) button.
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(/^(input|textarea|select)$/i.test(e.target.tagName||'')) return;
  if(SET&&(e.key==='PageUp'||e.key==='PageDown')){ const b=document.getElementById(e.key==='PageUp'?'sprev':'snext');
    if(b&&!b.disabled) b.click(); e.preventDefault(); return; }
  const box=document.getElementById('playbox');
  if(!box||box.style.display==='none') return;
  const hit=id=>{ const b=document.getElementById(id);
    if(b&&!b.disabled&&b.offsetParent!==null){ b.click(); return true; } return false; };
  let ok=false;
  if(PLAYMODE==='dd'){
    if(e.key==='ArrowRight') ok=hit('pn'); else if(e.key==='ArrowLeft') ok=hit('pp');
    else if(e.key==='ArrowDown') ok=hit('pt'); else if(e.key==='ArrowUp'||e.key==='Home') ok=hit('pf');
    else if(e.key==='End'&&jumpPlay&&SEQ){ jumpPlay(SEQ.length); ok=true; }
    else if(e.key===' '||e.code==='Space') ok=hit('pa');
  } else if(PLAYMODE==='ip'){
    const k=e.key.toLowerCase();
    if(e.key==='ArrowLeft'||e.key==='Backspace'||k==='u') ok=hit('ipu');
    else if(e.key==='ArrowRight') ok=hit('ipf');
    else if(e.key==='ArrowDown') ok=hit('iptrick'); else if(e.key==='ArrowUp'||e.key==='Home') ok=hit('ipstart');
    else if(e.key==='End'){ if(!veiled()) ipEnd(); ok=true; }
    else if(k==='r') ok=hit('ipr'); else if(k==='b') ok=hit('ipbest'); else if(k==='c') ok=hit('ipclaim');
  } else if(e.key==='Enter') ok=hit('tnext')||hit('setnext');
  if(ok) e.preventDefault();
});
const apiReady=findAPI();
render();
if(q.has("set")) setLoad();
apiReady.then(()=>{ if(BLIND&&!API){ BLIND=false; youPlay='all'; if(IP){ ipSyncTrainer(); ipPaint(); } } })
  .then(leadsBox).then(leadCost).then(auditPlay);
</script>
